<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; line-height: 1.7; color: #24292f; }
    a { color: #0969da; text-decoration: none; }
    a:hover { text-decoration: underline; }
    code { background: #f6f8fa; padding: 2px 6px; border-radius: 4px; }
    pre { background: #f6f8fa; padding: 12px; border-radius: 6px; overflow-x: auto; }
    img { max-width: 100%; }

    /* ===== 文字颜色（在笔记里用 <span class="red">文字</span>） ===== */
    .red    { color: #d32f2f; }
    .blue   { color: #1565c0; }
    .green  { color: #2e7d32; }
    .orange { color: #ef6c00; }
    .purple { color: #6a1b9a; }
    .gray   { color: #757575; }

    /* ===== 高亮底 ===== */
    .hl, .mark { background: #fff59d; padding: 0 3px; border-radius: 3px; }

    /* ===== 居中（<div class="center">文字</div>） ===== */
    .center { text-align: center; }

    /* ===== 提示框 ===== */
    .note { border-left: 4px solid #42a5f5; background: #e3f2fd; padding: 8px 14px; margin: 1em 0; border-radius: 0 6px 6px 0; }
    .warn { border-left: 4px solid #ef6c00; background: #fff3e0; padding: 8px 14px; margin: 1em 0; border-radius: 0 6px 6px 0; }

    /* ===== 表格美化 ===== */
    table { border-collapse: collapse; width: 100%; margin: 1em 0; }
    th, td { border: 1px solid #e0e0e0; padding: 6px 12px; }
    th { background: #f5f5f5; }

    /* ===== 站点头部与搜索框 ===== */
    .site-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
    .site-header .brand { font-weight: 700; font-size: 1.1rem; }
    .site-header .brand a { color: #24292f; }
    .search-wrap { position: relative; flex: 1; min-width: 220px; }
    #search-input { width: 100%; padding: 8px 12px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
    #search-results { list-style: none; margin: 4px 0 0; padding: 0; position: absolute; left: 0; right: 0; background: #fff; border: 1px solid #d0d7de; border-radius: 6px; box-shadow: 0 4px 12px rgba(0,0,0,.08); max-height: 320px; overflow: auto; z-index: 10; }
    #search-results li a { display: block; padding: 8px 12px; color: #24292f; }
    #search-results li a:hover { background: #f6f8fa; }
    #search-results .no-res { padding: 8px 12px; color: #757575; }

    /* 搜索模式切换 + 加载状态 */
    .search-modes { display: flex; gap: .75rem; margin: 6px 0 0; font-size: 13px; color: #57606a; }
    .search-modes label { cursor: pointer; user-select: none; }
    .search-status { font-size: 12px; color: #8c959f; margin-left: auto; }

    /* ===== wikilink 断链提示 ===== */
    .wikilink-missing { color: #b42318; border-bottom: 1px dotted #b42318; }
  </style>
</head>
<body>
  <header class="site-header">
    <span class="brand"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></span>
    <div class="search-wrap">
      <input type="search" id="search-input" placeholder="搜索笔记…" autocomplete="off">
      <div class="search-modes">
        <label><input type="radio" name="search-mode" value="all" checked> 全部</label>
        <label><input type="radio" name="search-mode" value="title"> 仅标题</label>
        <label><input type="radio" name="search-mode" value="body"> 仅正文</label>
        <span id="search-status" class="search-status"></span>
      </div>
      <ul id="search-results"></ul>
    </div>
  </header>
  <main>
    {{ content }}
  </main>

  <!-- 笔记索引：搜索与 wikilink 共用，由 Jekyll 在构建时从 site.pages 生成 -->
  <script type="application/json" id="note-index">
[
{% assign notes = site.pages | where_exp: "p", "p.path contains 'sources/' or p.path contains 'narrative/'" %}
{% for p in notes %}  {"title": {{ p.title | jsonify }}, "url": "{{ p.url | relative_url }}", "excerpt": {{ p.content | strip_html | strip_newlines | truncatewords: 30 | jsonify }}}{% unless forloop.last %},{% endunless %}
{% endfor %}
]
  </script>

  <script>
  (function () {
    var indexEl = document.getElementById('note-index');
    var DATA = [];
    try { DATA = indexEl ? JSON.parse(indexEl.textContent) : []; } catch (e) { console.error('note-index 解析失败', e); }

    // 加载状态角标：硬刷新后能看到「已索引 N 篇」即证明本版代码已生效
    var statusEl = document.getElementById('search-status');
    if (statusEl) statusEl.textContent = '已索引 ' + DATA.length + ' 篇';

    var input = document.getElementById('search-input');
    var results = document.getElementById('search-results');
    var modeRadios = document.querySelectorAll('input[name="search-mode"]');

    function currentMode() {
      var m = 'all';
      if (modeRadios) {
        for (var i = 0; i < modeRadios.length; i++) { if (modeRadios[i].checked) m = modeRadios[i].value; }
      }
      return m;
    }

    function doSearch(raw) {
      if (!results) return;
      var q = (raw || '').trim().toLowerCase();
      if (!q) { results.innerHTML = ''; return; }
      var mode = currentMode();
      var hits = DATA.filter(function (d) {
        var inTitle = d.title && d.title.toLowerCase().indexOf(q) > -1;
        var inBody  = d.excerpt && d.excerpt.toLowerCase().indexOf(q) > -1;
        if (mode === 'title') return inTitle;
        if (mode === 'body')  return inBody;
        return inTitle || inBody;
      }).slice(0, 20);
      if (!hits.length) { results.innerHTML = '<li class="no-res">无匹配结果</li>'; return; }
      results.innerHTML = hits.map(function (h) {
        return '<li><a href="' + h.url + '">' + h.title + '</a></li>';
      }).join('');
    }

    if (input && results) {
      // 触发时机尽量全面：输入（非组词中）、组词结束、按回车、点清除按钮、切换模式
      input.addEventListener('input', function (e) { if (e.isComposing) return; doSearch(e.target.value); });
      input.addEventListener('compositionend', function () { doSearch(input.value); });
      input.addEventListener('search', function () { doSearch(input.value); });
      input.addEventListener('keyup', function (e) { if (e.key === 'Enter') doSearch(input.value); });
      if (modeRadios) {
        for (var i = 0; i < modeRadios.length; i++) {
          modeRadios[i].addEventListener('change', function () { doSearch(input.value); });
        }
      }
      document.addEventListener('click', function (e) {
        if (!e.target.closest('.search-wrap')) results.innerHTML = '';
      });
    }

    // ===== wikilink：把正文中的 [[标题]] 转换为站内链接（独立 try，失败不影响搜索） =====
    try {
      var map = {};
      for (var j = 0; j < DATA.length; j++) { if (DATA[j].title) map[DATA[j].title] = DATA[j].url; }
      var main = document.querySelector('main');
      if (main) {
        var re = /\[\[([^\]]+)\]\]/g;
        var walker = document.createTreeWalker(main, NodeFilter.SHOW_TEXT, {
          acceptNode: function (node) {
            if (!node.nodeValue || node.nodeValue.indexOf('[[') === -1) return NodeFilter.FILTER_REJECT;
            var p = node.parentNode;
            if (p && (p.tagName === 'CODE' || p.tagName === 'PRE' || p.tagName === 'A' || p.tagName === 'SCRIPT' || p.tagName === 'STYLE')) return NodeFilter.FILTER_REJECT;
            return NodeFilter.FILTER_ACCEPT;
          }
        }, false);
        var targets = [];
        while (walker.nextNode()) targets.push(walker.currentNode);
        targets.forEach(function (textNode) {
          var html = textNode.nodeValue.replace(re, function (m, title) {
            title = title.trim();
            if (map[title]) return '<a href="' + map[title] + '">' + title + '</a>';
            return '<span class="wikilink-missing" title="未找到对应笔记">' + m + '</span>';
          });
          if (html !== textNode.nodeValue) {
            var span = document.createElement('span');
            span.innerHTML = html;
            textNode.parentNode.replaceChild(span, textNode);
          }
        });
      }
    } catch (e) { console.error('wikilink 转换失败', e); }
  })();
  </script>
</body>
</html>
