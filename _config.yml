title: 寒山唁的历史研究资料库
description: 寒山唁的历史研究资料库，使用 Obsidian 写作、Git 同步、GitHub Pages 发布。
markdown: kramdown

# 让单换行渲染为 <br>（硬换行），与 Obsidian 默认显示一致。
# 否则 kramdown 会把单独换行当成空格，导致笔记里的分行在网页上被压平。
kramdown:
  hard_wrap: true

# 站点部署在 https://hanshanyan.github.io/history/ ，baseurl 必须设为 /history，
# 否则站内链接（搜索结果、wikilink）会指向根域名而 404。
baseurl: /history

# 说明：GitHub Pages 自带的 jekyll-build-pages（github-pages gem）会忽略 _config.yml 里的
# collections 配置，因此内容笔记按“普通页面”处理（自动生成 /sources/xxx.html、/narrative/xxx.html）。
# 首页列表、搜索索引、wikilink 都通过 site.pages 过滤 path 包含 'sources/' 或 'narrative/' 来实现，
# 不依赖 collections 变量，也不依赖自定义 Ruby 插件（GitHub Pages 也不会执行插件）。
# 每篇笔记（sources/ 与 narrative/ 下）必须带 front matter：layout: default 与 title: ，
# 否则该页不会套用全局 CSS 变色、wikilink 转换，也不会进入搜索索引与首页列表。

# 不依赖任何外部 theme，避免 gem 依赖问题导致构建失败
exclude:
  - .obsidian
  - README.md
